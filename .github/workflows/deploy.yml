name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Checkout app repository (for plugin catalog)
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: ixxxxoooo/Fasty
          path: _fasty
          # If the app repository is private, provide a PAT:
          # token: ${{ secrets.FASTY_REPO_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Refresh plugin catalog
        # Falls back to the committed data/plugins.json if the app repo is unavailable.
        continue-on-error: true
        run: pnpm gen:plugins
        env:
          FASTY_REPO: ${{ github.workspace }}/_fasty

      - name: Build site
        run: pnpm docs:build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
